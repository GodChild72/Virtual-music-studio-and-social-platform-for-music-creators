<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Studio Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="studio">
    <h1>Studio Prototype</h1>
    <section class="controls">
      <button id="startBtn">Start Recording</button>
      <button id="stopBtn" disabled>Stop Recording</button>
      <button id="mixdownBtn" disabled>Export Mixdown (WAV)</button>
    </section>

    <section id="tracks" class="tracks">
      <!-- Tracks will be appended here -->
    </section>

    <section class="downloads">
      <h2>Downloads</h2>
      <ul id="downloadsList"></ul>
    </section>
  </main>

  <script src="src/studio.js"></script>
</body>
</html>
